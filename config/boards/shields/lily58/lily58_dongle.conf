CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SLEEP=n

# The xiao_ble board adds a USB CDC ACM serial console by default, which makes
# the dongle a composite device. Drop it so the dongle is a plain HID keyboard.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n

